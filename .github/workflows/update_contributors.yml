name: Update Contributors List

# TODO: Change this to the action needed I use this for testing based on the access that AS and myself have 
on:
  pull_request:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the action to push changes back to the repo
      pull-requests: write  # Allows the action to read pull request data

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install PyGithub

      - name: Run Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs/update_contributors.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CONTRIBUTORS.md
          git commit -m "docs: update community contributors list [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.head_ref }}
