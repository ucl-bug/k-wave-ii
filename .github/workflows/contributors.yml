name: Update Contributors

on:
  pull_request:

jobs:
  all-contributors:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install
        
      - name: Collect unique PR commit authors (GitHub usernames)
        id: authors
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            PR_NUMBER="${{ github.event.pull_request.number }}"

            COMMITS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" --paginate)

            # Extract primary authors (skip bots)
            PRIMARY_AUTHORS=$(echo "$COMMITS" | jq -r '
            .[].author
            | select(. != null and .type != "Bot" and .login != "github-actions[bot]")
            | .login
            ')

            # Extract co-authors from commit messages
            COAUTHORS=$(echo "$COMMITS" | jq -r '
            .[].commit.message
            | capture_all("Co-authored-by: (?<name>[^<]+) <(?<email>[^>]+)>")?
            | .[]?
            | .email
            ')

            # Convert co-author emails → GitHub usernames (if possible)
            COAUTHOR_LOGINS=""
            for email in $COAUTHORS; do
            login=$(gh api -H "Accept: application/vnd.github+json" \
                "/search/users?q=${email}+in:email" --jq '.items[0].login' 2>/dev/null || true)
            [ -n "$login" ] && COAUTHOR_LOGINS="$COAUTHOR_LOGINS"$'\n'"$login"
            done

            # Combine and dedupe
            ALL_AUTHORS=$(printf "%s\n%s\n" "$PRIMARY_AUTHORS" "$COAUTHOR_LOGINS" | sort -u)

            echo "Authors found:"
            echo "$ALL_AUTHORS"

            {
            echo "list<<EOF"
            echo "$ALL_AUTHORS"
            echo "EOF"
            } >> "$GITHUB_OUTPUT"


      - name: Add all commit authors as contributors
        run: |
          set -e
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "Adding contributor: $u"
            npx all-contributors add "$u" custom
          done <<< "${{ steps.authors.outputs.list }}"

          npx all-contributors generate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .all-contributorsrc
          git commit -m "docs: update contributors" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

