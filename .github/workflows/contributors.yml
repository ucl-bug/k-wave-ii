name: Update Contributors

on:
  pull_request:

jobs:
  all-contributors:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Collect unique PR authors + co-authors (GitHub usernames)
        id: authors
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            PR_NUMBER="${{ github.event.pull_request.number }}"

            # Pull PR commits as JSON
            gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" --paginate > pr_commits.json

            # 1) Direct commit authors GitHub usernames (from GitHub metadata)
            AUTHOR_LOGINS=$(jq -r '.[].author.login // empty' pr_commits.json)

            # 2) Co-authors parsed from commit message trailers
            # We try to extract usernames from GitHub noreply emails:
            #   Co-authored-by: X <username@users.noreply.github.com>
            #   Co-authored-by: X <123+username@users.noreply.github.com>
            COAUTHOR_LOGINS=$(jq -r '.[].commit.message // ""' pr_commits.json \
            | grep -iE '^co-authored-by:' || true \
            | sed -E 's/^Co-authored-by:\s*.*<([^>]+)>.*/\1/I' \
            | sed -E 's/^([0-9]+\+)?([^@]+)@users\.noreply\.github\.com$/\2/I' \
            | grep -vE '@' || true)

            # Combine + unique
            ALL=$(printf "%s\n%s\n" "$AUTHOR_LOGINS" "$COAUTHOR_LOGINS" | sed '/^$/d' | sort -u)

            echo "GitHub users found (authors + co-authors where resolvable):"
            echo "$ALL"

            {
            echo "list<<EOF"
            echo "$ALL"
            echo "EOF"
            } >> "$GITHUB_OUTPUT"

      - name: Add all commit authors as contributors
        run: |
          set -e
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "Adding contributor: $u"
            npx all-contributors add "$u" custom
          done <<< "${{ steps.authors.outputs.list }}"

          npx all-contributors generate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .all-contributorsrc
          git commit -m "docs: update contributors" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}