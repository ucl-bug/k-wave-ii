name: Update Contributors

on:
  pull_request:

jobs:
  all-contributors:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: Collect unique PR commit authors (GitHub usernames)
        id: authors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Get unique .author.login from PR commits; skip nulls
          AUTHORS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '[.[].author.login | select(. != null)] | unique | .[]')

          echo "Authors found:"
          echo "$AUTHORS"

          # Save multi-line output for next step
          {
            echo "list<<EOF"
            echo "$AUTHORS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add all commit authors as contributors
        run: |
          set -e
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "Adding contributor: $u"
            npx all-contributors add "$u" custom
          done <<< "${{ steps.authors.outputs.list }}"

          npx all-contributors generate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .all-contributorsrc
          git commit -m "docs: update contributors" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

