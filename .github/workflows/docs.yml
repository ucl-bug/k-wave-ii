name: Build docs
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    name: Build docs
    runs-on: Windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Build docs
        run: |
	  C:\Program Files\MATLAB\R2025b\bin -batch "kwave.utilities.GenerateDocumentation"
