name: Build docs
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    name: Build docs
    runs-on: Windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Build docs
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe -batch 'kwave.utilities.GenerateDocumentation'"

      - run: |
          cd
          dir

      - uses: actions/upload-artifact@v4
        with:
          name: all-helpfiles
          path: |
            "docs\helpfiles"
            "docs\helpfilesweb"