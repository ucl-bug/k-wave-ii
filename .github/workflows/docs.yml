name: Build docs
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  docs:
    name: Build docs (skipped on draft PRs)
    runs-on: Windows
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build docs
        run: |
          & "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" "-batch" "kwave.devtools.GenerateDocumentation"

      - name: Test docs
        shell: bash
        run: |
          source docs/test_doc_generation.sh

      - name: Deploy to GitHub Pages 
        run: | 
          pip install -r requirements.txt mkdocs
          gh-deploy --force
