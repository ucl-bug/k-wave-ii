name: Build docs
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - sp/49-deploy_gh_pages

jobs:
  docs:
    name: Build docs (skipped on draft PRs)
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # - name: Build docs
      #   run: |
      #     & "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" "-batch" "kwave.devtools.GenerateDocumentation"
          
      # - name: Test docs
      #   shell: bash
      #   run: |
      #     source docs/test_doc_generation.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build mkdocs
        run: |
          mkdocs build

      - uses: actions/upload-artifact@v4
        with:
          name: all-helpfiles
          path: |
            site
